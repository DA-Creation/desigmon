<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#202828"><title>디자인몬 어드벤처</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="gold.css"><link rel="stylesheet" href="game-only.css"></head>
<body><main><div class="layout"><section class="game-column" aria-label="게임"><div class="screen"><canvas id="world" width="160" height="144" tabindex="0" aria-label="방향키 또는 WASD로 이동, Enter로 대화. 인물을 클릭하면 걸어갑니다."></canvas><div class="location" id="location"><span class="location-dot"></span><div><strong>시작의 마을</strong><small>작은 작업들이 모이는 곳</small></div></div><div id="interactHint" class="interact-hint" hidden></div>
<div id="title" class="title-overlay"><h2>디자인몬<br><span>어드벤처</span></h2><div class="title-buttons"><button data-action="new" class="primary">새 게임</button><button id="continue" data-action="continue" class="secondary">이어하기</button></div><p id="saveError" class="save-error" role="status"></p></div>
<div id="dialog" class="dialog" hidden role="dialog" aria-modal="true" aria-label="대화"></div><div id="battle" class="battle" hidden aria-label="외주 프로젝트 배틀"></div><div id="modal" class="modal" hidden role="dialog" aria-modal="true" aria-label="게임 메뉴"></div></div>
<div class="game-toolbar"><span><kbd>WASD</kbd> 이동 <kbd>Z</kbd> 대화</span><div><button id="sound" aria-label="효과음 전환">♪ OFF</button><button data-action="team">동료</button><button data-action="journal">의뢰 노트</button><button data-action="save">저장</button><button data-action="menu" aria-label="메뉴 열기">☰</button></div></div>
<div class="touch-controls" aria-label="터치 조작"><div class="dpad"><button data-dir="up" aria-label="위로">↑</button><button data-dir="left" aria-label="왼쪽으로">←</button><button data-dir="down" aria-label="아래로">↓</button><button data-dir="right" aria-label="오른쪽으로">→</button></div><button data-action="interact" class="touch-a">A<small>대화</small></button><button data-action="back" class="touch-b">B<small>뒤로</small></button></div>
</section></div></main><div id="toast" class="toast" role="status" aria-live="polite"></div><input type="file" id="importSave" accept=".json,application/json" hidden><script src="data.js"></script><script src="core.js"></script><script src="art.js"></script><script src="app.js"></script></body></html>
