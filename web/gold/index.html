<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#181818"><title>골드 — 플레이 · 편집</title><link rel="stylesheet" href="editor.css"></head><body>
<main><section id="game"><div id="screenGrid"><div class="device"><div class="screen-view"><canvas title="방향키 이동 · X 확인 · Z 취소 · Enter 시작 · Shift 선택" id="screen" width="160" height="144" tabindex="0" aria-label="골드 1P 게임 화면"></canvas><div id="loader"><button id="openROM" class="primary">ROM 열기</button></div></div><button id="control1" class="device-control" aria-pressed="true" hidden>1P 조작</button></div><div id="peerScreen" class="device" hidden><div class="screen-view"><canvas id="screen2" width="160" height="144" tabindex="0" aria-label="골드 2P 게임 화면"></canvas></div><button id="control2" class="device-control" aria-pressed="false">2P 조작</button></div></div><div class="toolbar"><button id="pause" disabled>일시정지</button><button id="sound" disabled>소리 OFF</button><button id="save" disabled>저장</button><button id="load" disabled>이어하기</button><button id="edit" disabled>편집</button><button id="link" disabled aria-pressed="false">통신</button><button id="files">파일</button></div><div id="pad"><div class="dpad"><button data-key="up" aria-label="위">↑</button><button data-key="left" aria-label="왼쪽">←</button><button data-key="down" aria-label="아래">↓</button><button data-key="right" aria-label="오른쪽">→</button></div><button data-key="B">B</button><button data-key="A">A</button><button data-key="select">SELECT</button><button data-key="start">START</button></div><p id="status" role="status"></p></section>
<section id="editor" hidden aria-label="ROM 편집기"><header><strong>ROM 편집</strong><div><button id="undo">되돌리기</button><button id="redo">다시</button><button id="apply" class="primary">수정본 실행</button><button id="closeEditor" aria-label="편집 닫기">×</button></div></header><nav><button data-tab="pokemon" class="selected">몬스터</button><button data-tab="moves">기술</button><button data-tab="evolution">진화 · 성장</button><button data-tab="sprite">스프라이트</button><button data-tab="scenario">시나리오</button><button data-tab="source">전체 소스</button><button data-tab="code">코드</button><button data-tab="bytes">바이트</button><button data-tab="changes">변경 내역</button></nav><div id="panel"></div></section></main>
<dialog id="fileMenu"><form method="dialog"><header><strong>파일</strong><button aria-label="닫기">×</button></header></form><div class="file-actions"><button id="changeROM">ROM 열기</button><button id="exportROM">수정 ROM</button><button id="exportPatch">IPS 패치</button><button id="exportProject">편집 프로젝트</button><button id="importProject">프로젝트 가져오기</button><button id="exportSave">게임 세이브 내보내기</button><button id="importSave">게임 세이브 가져오기</button><button id="exportState">실행 상태 내보내기</button><button id="importState">실행 상태 가져오기</button></div></dialog>
<dialog id="linkMenu"><form method="dialog"><header><strong>통신</strong><button aria-label="통신 닫기">×</button></header></form><div class="file-actions"><label for="linkMode">연결</label><select id="linkMode"><option value="link">케이블</option><option value="infrared">적외선</option><option value="both">케이블 + 적외선</option></select><label for="peerROMSource">2P ROM</label><select id="peerROMSource"><option value="current">실행 중 ROM</option><option value="original">원본 ROM</option></select><button id="bootPeer" class="primary">2P 시작</button><div class="row link-actions"><button id="connectPeer" disabled>연결</button><button id="disconnectPeer" disabled>연결 해제</button></div><button id="exportPeerSave" disabled>2P 게임 세이브 내보내기</button><button id="importPeerSave">2P 게임 세이브 가져오기</button></div></dialog>
<input id="peerSaveFile" type="file" accept=".sav" hidden>
<input id="romFile" type="file" accept=".gb,.gbc,.zip" hidden><input id="projectFile" type="file" accept=".json" hidden><input id="saveFile" type="file" accept=".sav" hidden><input id="stateFile" type="file" accept=".json" hidden>
<script src="../vendor/fflate.js"></script><script src="../vendor/sameboy.js"></script><script src="../vendor/sameboy-boot.js"></script><script src="rom-schema.js"></script><script src="rom-project.js"></script><script src="layout-check.js"></script><script src="layout-history.js"></script><script src="cpu.js"></script><script src="runtime.js"></script><script src="../../tools/gold-source/source-builder.js"></script><script src="../vendor/rgbds/rgbasm.js"></script><script src="../vendor/rgbds/rgblink.js"></script><script src="../vendor/rgbds/rgbfix.js"></script><script src="../vendor/rgbds/rgbgfx.js"></script><script src="../../tools/gold-source/runtime/gfx.js"></script><script src="../../tools/gold-source/runtime/gbcpal.js"></script><script src="../../tools/gold-source/runtime/lzcompress.js"></script><script src="../../tools/gold-source/runtime/png_dimensions.js"></script><script src="source-build.js"></script><script src="scenario.js"></script><script src="scenario-panel.js"></script><script src="editor-panels.js"></script><script src="editor.js"></script></body></html>
