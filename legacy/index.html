<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>디자인몬 어드벤처 - 일러몬 크기 조정</title>
  <style>
    /* --- [1. 디자인 시스템] --- */
    :root {
      --bg: #0f111a; --panel-bg: rgba(20, 24, 36, 0.95); --panel-border: rgba(255, 255, 255, 0.15);
      --text-main: #eef2ff; --text-muted: #8b9bb4; --accent: #64f4ac; --primary: #5c8aff;
      --danger: #ff5c5c; --item-bg: rgba(255,255,255,0.05); --font-ui: system-ui, -apple-system, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; background: var(--bg); overflow: hidden; font-family: var(--font-ui); color: var(--text-main); user-select: none; touch-action: none; }
    canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; }

    /* --- [2. UI 레이어] --- */
    #intro-bg { position: fixed; inset: 0; z-index: 998; background-color:#000; background-position:center; background-size:cover; transition:0.5s; }
    #intro-bg::after { content:''; position:absolute; inset:0; background:rgba(0,0,0,0.7); }
    #intro-layer { position: fixed; inset: 0; z-index: 999; display: flex; flex-direction: column; justify-content: center; align-items: center; transition: opacity 1s; }
    #intro-layer.hidden { opacity: 0; pointer-events: none; }
    .intro-text-box { text-align: center; color: #fff; padding: 20px; display: flex; flex-direction: column; align-items: center; gap: 30px; position: relative; z-index: 1000; }
    .intro-main-text { font-size: 20px; line-height: 1.6; font-weight: 300; letter-spacing: 1px; min-height: 60px; transition: all 0.5s; }
    .glitch { color: var(--danger); font-weight: bold; font-family: monospace; text-shadow: 2px 0 #fff, -2px 0 #ff00c1; animation: noise 0.2s infinite; }
    @keyframes noise { 0% { transform: translate(0,0); } 20% { transform: translate(-2px,2px); } 40% { transform: translate(-2px,-2px); } 60% { transform: translate(2px,2px); } 80% { transform: translate(2px,-2px); } 100% { transform: translate(0,0); } }
    .intro-guide { font-size: 12px; color: #aaa; border: 1px solid #555; padding: 8px 16px; border-radius: 99px; animation: blink 1.5s infinite; }
    @keyframes blink { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
    #white-flash { position: fixed; inset: 0; background: #fff; z-index: 1000; pointer-events: none; opacity: 0; transition: opacity 2s; }
    #white-flash.flash { opacity: 1; }

    /* 대화창 UI */
    #dialog-box { 
      position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%); 
      width: min(800px, 90vw); background: rgba(0,0,0,0.9); 
      border: 2px solid var(--panel-border); border-radius: 12px; padding: 20px 30px; 
      display: none; z-index: 500; color: var(--text-main); font-size: 16px; line-height: 1.6; 
      box-shadow: 0 10px 40px rgba(0,0,0,0.5); flex-direction: column; gap: 15px;
    }
    #dialog-box.visible { display: flex; animation: slideUp 0.5s ease-out; }
    @keyframes slideUp { from { transform: translate(-50%, 20px); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } }
    .dialog-content { flex: 1; }
    .dialog-next { align-self: flex-end; font-size: 12px; color: var(--accent); animation: blink 1s infinite; }
    .choice-container { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 5px; }
    .choice-btn {
      background: rgba(255,255,255,0.05); border: 1px solid var(--panel-border); color: var(--text-muted);
      padding: 10px 20px; border-radius: 8px; cursor: pointer; transition: all 0.1s; font-size: 14px;
    }
    .choice-btn.active, .choice-btn:hover { 
      background: var(--accent); color: #000; border-color: var(--accent); font-weight: bold; transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(100, 244, 172, 0.3);
    }

    /* 게임 UI */
    .ui-layer { position: absolute; inset: 0; pointer-events: none; padding: 20px; display: flex; flex-direction: column; justify-content: space-between; z-index: 10; opacity: 0; transition: opacity 1s; }
    .ui-layer.visible { opacity: 1; }
    .panel { background: var(--panel-bg); border: 1px solid var(--panel-border); backdrop-filter: blur(12px); border-radius: 16px; padding: 12px 16px; pointer-events: auto; box-shadow: 0 8px 32px rgba(0,0,0,0.3); }
    .top-row, .bottom-row { display: flex; justify-content: space-between; width: 100%; pointer-events: none; }
    .status-bar { display: flex; gap: 12px; align-items: center; pointer-events: auto; }
    .avatar-box { width: 48px; height: 48px; background: var(--primary); border-radius: 12px; overflow:hidden; position:relative; border:2px solid rgba(255,255,255,0.2); }
    .avatar-face { width: 100%; height: 100%; background-image: url('assets/hero_sheet.png'); background-size: 300% 300%; background-position: 50% 0; image-rendering: pixelated; }
    .info { display: flex; flex-direction: column; gap: 4px; min-width: 140px; }
    .name { font-weight: 800; font-size: 14px; display: flex; justify-content: space-between; }
    .stat-text { font-size: 10px; color: var(--text-muted); font-weight: normal; }
    .bar-container { position: relative; height: 6px; background: rgba(0,0,0,0.5); border-radius: 4px; overflow: hidden; margin-bottom: 3px; }
    .bar-fill { height: 100%; width: 100%; transition: width 0.2s; }
    .hp-fill { background: var(--danger); } .mp-fill { background: var(--primary); }
    .btn-icon { width: 44px; height: 44px; background: var(--panel-bg); border: 1px solid var(--panel-border); border-radius: 12px; color: var(--text-main); font-size: 20px; cursor: pointer; display: grid; place-items: center; pointer-events: auto; transition: 0.2s; }
    .btn-icon:hover { background: rgba(255,255,255,0.1); transform: scale(1.05); }
    .bottom-row { align-items: flex-end; }
    .system-log { width: 320px; height: 100px; font-size: 12px; color: var(--text-muted); overflow-y: auto; display: flex; flex-direction: column; justify-content: flex-end; pointer-events: auto; }
    .log-item { margin-top: 4px; }
    
    .menu-key { position: absolute; right: -6px; bottom: -6px; background: var(--accent); color: #000; font-size: 10px; font-weight: 800; padding: 2px 6px; border-radius: 999px; border: 1px solid rgba(0,0,0,0.4); box-shadow: 0 4px 10px rgba(100,244,172,0.35); }

    /* 모달 스타일 */
    .modal-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(8px); z-index: 100; pointer-events: auto; display: flex; justify-content: center; align-items: center; opacity: 0; pointer-events: none; transition: opacity 0.2s; }
    .modal-overlay.open { opacity: 1; pointer-events: auto; }
    .modal-box { width: 720px; height: 480px; background: #1a1d2b; border: 1px solid var(--panel-border); border-radius: 20px; display: flex; flex-direction: column; overflow: hidden; transform: scale(0.95); transition: transform 0.2s; }
    .modal-overlay.open .modal-box { transform: scale(1); }
    .modal-tabs { display: flex; background: rgba(0,0,0,0.3); border-bottom: 1px solid var(--panel-border); }
    .tab-btn { flex: 1; padding: 14px; background: transparent; border: none; color: var(--text-muted); font-weight: bold; cursor: pointer; border-bottom: 3px solid transparent; transition: 0.2s; }
    .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); background: rgba(255,255,255,0.05); }
    .modal-content { flex: 1; display: none; padding: 20px; gap: 20px; overflow: hidden; }
    .modal-content.active { display: flex; }
    .close-btn { position: absolute; top: 15px; right: 15px; background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 24px; }
    
    .trainer-layout { width: 100%; display: grid; grid-template-columns: 240px 1fr; gap: 20px; }
    .profile-card, .stats-card { background: rgba(255,255,255,0.03); border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
    .stat-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
    .stat-label { width: 90px; font-size: 13px; color: var(--text-muted); }
    .stat-bar-bg { flex: 1; height: 8px; background: rgba(0,0,0,0.5); border-radius: 4px; overflow: hidden; }
    .stat-bar-val { height: 100%; background: var(--accent); }
    .save-controls { display: flex; gap: 10px; margin-top: auto; }
    .save-btn { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid var(--panel-border); background: rgba(255,255,255,0.05); color: var(--text-muted); cursor: pointer; transition: 0.2s; font-weight: bold;}
    .save-btn:hover, .save-btn.selected { background: var(--accent); color: #000; border-color: var(--accent); transform: translateY(-2px); box-shadow: 0 4px 12px rgba(100,244,172,0.3); }
    .save-btn.reset:hover, .save-btn.reset.selected { background: var(--danger); color: white; border-color: var(--danger); box-shadow: 0 4px 12px rgba(255,92,92,0.3); }
    .party-layout { width: 100%; display: grid; grid-template-columns: 280px 1fr; gap: 20px; }
    .mon-list { display: flex; flex-direction: column; gap: 10px; overflow-y: auto; padding-right: 5px; }
    .mon-slot, .item-slot { display: flex; align-items: center; gap: 12px; padding: 10px; background: var(--item-bg); border-radius: 10px; cursor: pointer; border: 1px solid transparent; }
    .mon-slot.selected, .item-slot.selected { border-color: var(--accent); background: rgba(100, 244, 172, 0.1); }
    .mon-icon, .item-icon { width: 40px; height: 40px; background: rgba(0,0,0,0.3); border-radius: 8px; display: grid; place-items: center; font-size: 20px; overflow: hidden; }
    .mon-icon img, .item-icon img { width: 100%; height: 100%; object-fit: contain; image-rendering: pixelated; } /* 픽셀 아트 유지 */
    .mon-detail, .inv-detail { background: rgba(0,0,0,0.2); border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
    .inv-layout { display: flex; height: 100%; width: 100%; }
    .inv-list { flex: 1; overflow-y: auto; padding-right: 10px; display: flex; flex-direction: column; gap: 8px; }
    .inv-detail { width: 220px; padding-left: 20px; border-left: 1px solid rgba(255,255,255,0.1); align-items: center; text-align: center; }
    .btn-action { width: 100%; padding: 12px; margin-top: auto; background: var(--accent); color: #000; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
    .btn-action:disabled { opacity: 0.5; cursor: not-allowed; }

    .gameover-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.9); z-index: 999; display: none; justify-content: center; align-items: center; flex-direction: column; }
    #toast-msg {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      background: rgba(0,0,0,0.9); color: var(--accent); padding: 15px 30px;
      border: 1px solid var(--accent); border-radius: 30px; z-index: 2000;
      font-weight: bold; opacity: 0; pointer-events: none; transition: opacity 0.3s;
    }
    #toast-msg.show { opacity: 1; }
    #manual-overlay {
      position: fixed; inset: 0; z-index: 700; display: none; place-items: center;
      background: rgba(0,0,0,0.7); backdrop-filter: blur(6px);
    }
    #manual-overlay.open { display: grid; }
    .manual-box {
      width: min(720px, 92vw); background: rgba(10,12,18,0.95);
      border: 1px solid var(--panel-border); border-radius: 16px; padding: 22px 26px;
      box-shadow: 0 16px 40px rgba(0,0,0,0.6);
    }
    .manual-title { font-weight: 800; font-size: 16px; margin-bottom: 10px; color: var(--accent); }
    .manual-list { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 16px; font-size: 13px; color: var(--text-muted); }
    .manual-item { display: flex; justify-content: space-between; gap: 10px; }
    .manual-key { color: var(--text-main); font-weight: 700; }
  </style>
</head>
<body>

<div class="game-container">
  <canvas id="cv"></canvas>
  <div id="intro-bg"></div>
  <div id="intro-layer"><div class="intro-text-box"><div class="intro-main-text" id="intro-text"></div><div class="intro-guide" id="intro-guide">[ ENTER / SPACE ]</div></div></div>
  <div id="white-flash"></div>

  <div class="ui-layer" id="game-ui">
    <div class="top-row">
      <div class="panel status-bar">
        <div class="avatar-box"><div class="avatar-face"></div><div class="menu-key">I</div></div>
        <div class="info">
          <div class="name">YOU <span class="stat-text" id="stat-text">100/100</span></div>
          <div class="bar-container"><div class="bar-fill hp-fill" id="hp-bar" style="width: 100%;"></div></div>
          <div class="bar-container"><div class="bar-fill mp-fill" id="mp-bar" style="width: 100%;"></div></div>
          <div class="stat-text">I: 상태창  Q/E: 탭 전환</div>
        </div>
      </div>
      <button class="btn-icon" onclick="openModal('trainer')" title="메뉴 (I)">👤</button>
    </div>
    <div class="bottom-row">
      <div class="panel system-log" id="sys-log"><div class="log-item">시스템: 디자인몬 세계에 오신 것을 환영합니다!</div></div>
    </div>
  </div>

  <div id="dialog-box">
    <div class="dialog-content" id="dialog-text"></div>
    <div class="choice-container" id="choice-container"></div>
    <div class="dialog-next" id="dialog-next">▼ Enter / Space</div>
  </div>

  <div id="manual-overlay">
    <div class="manual-box">
      <div class="manual-title">조작법</div>
      <div class="manual-list">
        <div class="manual-item"><span>이동</span><span class="manual-key">W/A/S/D, 방향키</span></div>
        <div class="manual-item"><span>상호작용</span><span class="manual-key">Space</span></div>
        <div class="manual-item"><span>메뉴</span><span class="manual-key">I</span></div>
        <div class="manual-item"><span>탭 전환</span><span class="manual-key">Q / E</span></div>
        <div class="manual-item"><span>조작법</span><span class="manual-key">T</span></div>
        <div class="manual-item"><span>닫기</span><span class="manual-key">Esc</span></div>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="modal-overlay">
    <div class="modal-box">
      <div class="modal-tabs">
        <button class="tab-btn" id="tab-trainer" onclick="switchTab('trainer')">트레이너</button>
        <button class="tab-btn" id="tab-party" onclick="switchTab('party')">파티</button>
        <button class="tab-btn" id="tab-inventory" onclick="switchTab('inventory')">가방</button>
      </div>
      <button class="close-btn" onclick="closeModal()">×</button>
      
      <div class="modal-content" id="view-trainer">
        <div class="trainer-layout">
          <div class="profile-card">
            <div style="width:80px; height:80px; background:#5c8aff; border-radius:50%; margin:0 auto 10px;"></div>
            <div style="font-size:18px; font-weight:bold; text-align:center;">YOU</div>
            <div style="text-align:center; color:var(--primary); font-size:12px; font-weight:bold;">초년생 디자이너</div>
            <div style="margin-top:20px; font-size:13px; color:#aaa;"><div>평판: 1,500</div><div id="location-text">위치: -</div></div>
            <div class="save-controls" id="save-controls"></div>
          </div>
          <div class="stats-card"><div style="font-weight:bold; margin-bottom:10px;">능력치 (Stats)</div><div id="trainer-stats-container"></div></div>
        </div>
      </div>
      <div class="modal-content" id="view-party"><div class="party-layout"><div class="mon-list" id="party-list"></div><div class="mon-detail" id="party-detail"><div style="color:#888; text-align:center; margin-top:100px;">디자인몬을 선택하세요.</div></div></div></div>
      <div class="modal-content" id="view-inventory"><div class="inv-layout"><div class="inv-list" id="inv-list"></div><div class="inv-detail"><div style="font-size:48px; margin:20px 0;" id="inv-icon">📦</div><div style="font-weight:bold; margin-bottom:10px;" id="inv-name">선택 없음</div><div style="font-size:13px; color:#aaa; margin-bottom:20px; line-height:1.4;" id="inv-desc">...</div><button class="btn-action" id="inv-use-btn" onclick="useItem()" disabled>사용하기</button></div></div></div>
    </div>
  </div>

  <div id="toast-msg">저장되었습니다!</div>
  <div class="gameover-overlay" id="go-screen"><h1 style="color:red; font-size:40px; margin-bottom:20px;">GAME OVER</h1><p style="color:#aaa; margin-bottom:30px;">건강이나 멘탈 관리에 실패했습니다.</p><button onclick="location.reload()" style="padding:12px 30px; background:#fff; border:none; border-radius:99px; cursor:pointer; font-weight:bold;">다시하기</button></div>
</div>

<script>
/* --- [1. 시스템 설정] --- */
const canvas = document.getElementById('cv');
const ctx = canvas.getContext('2d');
const logEl = document.getElementById('sys-log');
const DPR = Math.min(2, window.devicePixelRatio || 1);
const ZOOM_LEVEL = 0.4;

function log(msg) {
  const div = document.createElement('div');
  div.className = 'log-item'; div.innerHTML = `> ${msg}`;
  logEl.appendChild(div); logEl.scrollTop = logEl.scrollHeight;
}
function resize() {
  canvas.width = window.innerWidth * DPR; canvas.height = window.innerHeight * DPR;
  canvas.style.width = window.innerWidth + 'px'; canvas.style.height = window.innerHeight + 'px';
}
window.addEventListener('resize', resize); resize();
function showToast(msg) { const t=document.getElementById('toast-msg'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2000); }

/* --- [2. 에셋 로드] --- */
const heroImg = new Image(); heroImg.src = 'assets/hero_sheet.png';
heroImg.onload = () => { state.sprite.loaded = true; state.sprite.w = Math.floor(heroImg.width / 3); state.sprite.h = Math.floor(heroImg.height / 3); if(npcImgLoaded)updateNPCSize(); updateIllumonSize(); };

let npcImgLoaded = false; const npcImg = new Image(); npcImg.src = 'assets/npc_guide.png';
npcImg.onload = () => { npcImgLoaded = true; updateNPCSize(); };

let npcChiefLoaded = false; const npcChiefImg = new Image(); npcChiefImg.src = 'assets/npc_chief.png';
npcChiefImg.onload = () => { npcChiefLoaded = true; updateNPCSize(); };

function updateNPCSize() {
  const heroH = state.sprite.h || 48; const targetH = heroH * 1.5;
  state.npcs.forEach(n => {
    const img = n.id === 'chief' ? npcChiefImg : npcImg;
    const loaded = n.id === 'chief' ? npcChiefLoaded : npcImgLoaded;
    if (!loaded || !img.width) return;
    const aspectRatio = img.width / img.height; const targetW = targetH * aspectRatio;
    n.w = targetW; n.h = targetH;
  });
}

// 일러몬 (동행) 이미지
let illumonLoaded = false; const illumonImg = new Image(); illumonImg.src = 'assets/mon_illumon.png';
illumonImg.onload = () => { illumonLoaded = true; updateIllumonSize(); };

function updateIllumonSize() {
  if (!state.sprite.loaded || !illumonLoaded) return;
  const heroH = state.sprite.h;
  const targetH = heroH * 0.4; // 캐릭터의 0.4배
  const aspectRatio = illumonImg.width / illumonImg.height;
  const targetW = targetH * aspectRatio;
  state.companion.w = targetW;
  state.companion.h = targetH;
}

const villageImg = new Image(); villageImg.src = 'assets/map_village.jpg';

/* --- [3. 맵 데이터] --- */
const MAP_SCALE = 2.5; 
const ORIGIN_W = 1000; 
const portals = [
  { id: 'house1', x: 188 * MAP_SCALE, y: 283 * MAP_SCALE, w: 60, h: 60, target: 'indoor1', label: "집" },
  { id: 'house2', x: 888 * MAP_SCALE, y: 283 * MAP_SCALE, w: 60, h: 60, target: 'indoor2', label: "상점" },
  { id: 'house3', x: 188 * MAP_SCALE, y: 878 * MAP_SCALE, w: 60, h: 60, target: 'indoor3', label: "오두막" },
  { id: 'house4', x: 888 * MAP_SCALE, y: 878 * MAP_SCALE, w: 60, h: 60, target: 'indoor4', label: "창고" }
];
const indoors = {
  'indoor1': { color: '#8c5e3c', w: 800, h: 600, name: "플레이어의 집", parent: 'house1' },
  'indoor2': { color: '#5e8c8c', w: 800, h: 600, name: "아이템 상점", parent: 'house2' },
  'indoor3': { color: '#8c3c3c', w: 600, h: 600, name: "낡은 오두막", parent: 'house3' },
  'indoor4': { color: '#555555', w: 600, h: 600, name: "자재 창고", parent: 'house4' }
};

function drawCurrentMap() {
  const m = state.map;
  if (state.location === 'village') {
    if (villageImg.complete) ctx.drawImage(villageImg, 0, 0, m.w, m.h);
    else { ctx.fillStyle = '#4a8538'; ctx.fillRect(0,0,m.w,m.h); }
    portals.forEach(p => {
      const glow = Math.sin(Date.now() / 200) * 5 + 40;
      ctx.beginPath(); ctx.arc(p.x, p.y, glow, 0, Math.PI*2); ctx.fillStyle = "rgba(255, 255, 100, 0.4)"; ctx.fill();
      ctx.beginPath(); ctx.arc(p.x, p.y, 15, 0, Math.PI*2); ctx.fillStyle = "rgba(255, 255, 255, 0.8)"; ctx.fill();
    });
  } else if (state.location.startsWith('indoor')) {
    const room = indoors[state.location];
    ctx.fillStyle = room.color; ctx.fillRect(0, 0, room.w, room.h);
    ctx.lineWidth = 20; ctx.strokeStyle = '#222'; ctx.strokeRect(0, 0, room.w, room.h);
    const exitX = room.w/2; const exitY = room.h - 40;
    const glow = Math.sin(Date.now() / 200) * 5 + 35;
    ctx.beginPath(); ctx.arc(exitX, exitY, glow, 0, Math.PI*2); ctx.fillStyle = "rgba(100, 255, 255, 0.4)"; ctx.fill();
    ctx.fillStyle = "white"; ctx.font="16px sans-serif"; ctx.textAlign="center"; ctx.fillText("EXIT", exitX, exitY+5);
  }
}

/* --- [4. NPC 데이터] --- */
const dialogueData = {
  "chief": {
    "start": {

let state = JSON.parse(JSON.stringify(initialState));

function saveGame() {
  const saveData = { player: state.player, location: state.location, inventory: state.inventory, party: state.party, introStep: state.introStep, mode: 'play' };
  localStorage.setItem('dmAdventureSave', JSON.stringify(saveData));
  showToast("게임이 저장되었습니다!");
}
function loadGame() {
  const saveStr = localStorage.getItem('dmAdventureSave');
  if (!saveStr) { showToast("저장된 데이터가 없습니다."); return; }
  try {
    const data = JSON.parse(saveStr);
    state.player = data.player; state.location = data.location; state.inventory = data.inventory; state.party = data.party; state.introStep = data.introStep || 999; state.mode = 'play';
    if (state.location === 'village' && villageImg.complete) { state.map.w = villageImg.naturalWidth * MAP_SCALE; state.map.h = villageImg.naturalHeight * MAP_SCALE; }
    else if (indoors[state.location]) { const room = indoors[state.location]; state.map.w = room.w; state.map.h = room.h; }
    closeModal(); document.getElementById('dialog-box').classList.remove('visible'); document.getElementById('game-ui').classList.add('visible'); document.getElementById('intro-layer').classList.add('hidden'); document.getElementById('intro-bg').style.opacity = 0;
    updateCameraImmediate(); showToast("데이터를 불러왔습니다!");
  } catch (e) { console.error(e); showToast("세이브 파일 오류!"); }
}
function resetGame() { if(!confirm("정말 처음부터 다시 시작하시겠습니까?")) return; localStorage.removeItem('dmAdventureSave'); location.reload(); }

villageImg.onload = () => { if (villageImg.naturalWidth > 0 && state.location === 'village') { state.map.w = villageImg.naturalWidth * MAP_SCALE; state.map.h = villageImg.naturalHeight * MAP_SCALE; } };

/* --- [6. 인트로] --- */
const introSequence = [ { type: 'text', text: "모니터 불빛만이 방을 비추고 있다.", bg: 'assets/bg_reality.png' }, { type: 'text', text: "오늘도 포트폴리오를 수정했다.", bg: 'assets/bg_reality.png' }, { type: 'glitch', text: "시스템 경고: 알 수 없는 오류 발생", bg: 'assets/bg_glitch.png' }, { type: 'transition', text: "", bg: 'assets/bg_warp.png' }, { type: 'dialog', text: "눈을 뜨자, 낯선 마을 한가운데 서 있었다.", bg: 'assets/bg_world.png' }, { type: 'dialog', text: "이곳은... <b style='color:#64f4ac'>디자인몬 세계</b>." }, { type: 'dialog', text: "이제, 방향키를 눌러 모험을 시작하세요." } ];
const introBg = document.getElementById('intro-bg'); const introLayer = document.getElementById('intro-layer'); const introText = document.querySelector('.intro-main-text'); const introGuide = document.getElementById('intro-guide'); const dialogBox = document.getElementById('dialog-box'); const dialogText = document.getElementById('dialog-text'); const choiceContainer = document.getElementById('choice-container'); const dialogNext = document.getElementById('dialog-next'); const whiteFlash = document.getElementById('white-flash'); const gameUI = document.getElementById('game-ui'); const manualOverlay = document.getElementById('manual-overlay');

function renderIntroStep() {
  const scene = introSequence[state.introStep];
  if (!scene) { endIntro(); return; }
  if (scene.bg) introBg.style.backgroundImage = `url('${scene.bg}')`;
  if (scene.type === 'text' || scene.type === 'glitch') {
    introText.innerHTML = scene.text; introText.className = scene.type === 'glitch' ? 'intro-main-text glitch' : 'intro-main-text'; introGuide.style.display = 'block';
  } else if (scene.type === 'transition') {
    introGuide.style.display = 'none'; whiteFlash.classList.add('flash'); setTimeout(() => { introLayer.classList.add('hidden'); }, 1500); setTimeout(() => { whiteFlash.classList.remove('flash'); state.introStep++; renderIntroStep(); }, 2500);
  } else if (scene.type === 'dialog') {
    introLayer.classList.add('hidden'); introBg.style.opacity = 0; dialogBox.classList.add('visible'); dialogText.innerHTML = scene.text; introGuide.style.display = 'none'; choiceContainer.innerHTML = '';
  }
}
function endIntro() { state.mode = 'play'; dialogBox.classList.remove('visible'); gameUI.classList.add('visible'); const cw = canvas.width/DPR/ZOOM_LEVEL; const ch = canvas.height/DPR/ZOOM_LEVEL; state.cam.x = state.player.x - cw/2; state.cam.y = state.player.y - ch/2; spawnIllumonCompanion(); log("T를 눌러 조작법을 본다"); }

function toggleManual() { manualOverlay.classList.toggle('open'); }

let dialogTimer = null;
function showDialogMessage(text, duration = 2200) {
  if (state.dialog.active) return;
  dialogText.innerHTML = text;
  choiceContainer.innerHTML = '';
  dialogNext.style.display = 'none';
  dialogBox.classList.add('visible');
  if (dialogTimer) clearTimeout(dialogTimer);
  dialogTimer = setTimeout(() => {
    if (!state.dialog.active) dialogBox.classList.remove('visible');
  }, duration);
}

function spawnIllumonCompanion() {
  if (state.location !== 'village') return;
  const p = state.player; const s = state.sprite;
  const footY = p.y + (s.h || 32) / 2;
  state.companion.active = true;
  state.companion.spawnTime = Date.now();
  state.companion.history = [{ x: p.x, y: footY, t: Date.now() }];
  state.companion.effectPieces = [];
  const cw = canvas.width / DPR / ZOOM_LEVEL;
  const ch = canvas.height / DPR / ZOOM_LEVEL;
  state.companion.effectBounds = {
    left: state.cam.x,
    right: state.cam.x + cw,
    top: state.cam.y,
    bottom: state.cam.y + ch
  };
  const offsetX = -(s.w || 32) * 0.8;
  state.companion.x = p.x + offsetX;
  state.companion.y = footY;
  state.companion.prevX = state.companion.x;
  showDialogMessage("일러몬이 날 따라온다!");
}

/* --- [7. 상호작용] --- */
function checkInteraction() {
  const p = state.player;
  const INTERACTION_RANGE = 120;
  
    if (state.location === 'village') {
      const npc = state.npcs.find(n => Math.abs(n.x - p.x) < 100 && Math.abs(n.y - p.y) < 100);
      if (npc) { startDialogue(npc.id); return; }
      const portal = portals.find(pt => {
        const dist = Math.sqrt(Math.pow(pt.x - p.x, 2) + Math.pow(pt.y - p.y, 2));
        return dist < INTERACTION_RANGE;
      });
      if (portal) { enterBuilding(portal.target); return; }
  } 
  else if (state.location.startsWith('indoor')) {
    const room = indoors[state.location];
    const exitX = room.w/2; const exitY = room.h - 40;
    const dist = Math.sqrt(Math.pow(exitX - p.x, 2) + Math.pow(exitY - p.y, 2));
    if (dist < INTERACTION_RANGE) { exitBuilding(); return; }
  }
  log("주변에 상호작용할 대상이 없습니다.");
}

function enterBuilding(indoorId) {
  const room = indoors[indoorId]; if(!room) return;
    state.location = indoorId;
    state.map.w = room.w;
    state.map.h = room.h;
    state.player.x = room.w / 2;
    state.player.y = room.h - 100;
    state.player.dir = 'up';
    log(`'${room.name}'에 들어왔습니다.`);
    updateCameraImmediate();
}

function exitBuilding() {
  const currentRoom = indoors[state.location];
  state.location = 'village';
  if (villageImg.complete) { state.map.w = villageImg.naturalWidth * MAP_SCALE; state.map.h = villageImg.naturalHeight * MAP_SCALE; }
  const portal = portals.find(p => p.id === currentRoom.parent);
  if (portal) { state.player.x = portal.x; state.player.y = portal.y + 60; } 
  else { state.player.x = state.map.w / 2; state.player.y = state.map.h / 2; }
  state.player.dir = 'down';
  log("마을로 나왔습니다.");
  updateCameraImmediate();
}

function updateCameraImmediate() {
  const cw = canvas.width/DPR/ZOOM_LEVEL; const ch = canvas.height/DPR/ZOOM_LEVEL;
  state.cam.x = state.player.x - cw/2; state.cam.y = state.player.y - ch/2;
}

// 대화
function startDialogue(npcId) { state.mode = 'dialog'; state.dialog.active = true; state.dialog.npcId = npcId; showDialogNode('start'); }
function showDialogNode(nodeKey) { const data = dialogueData[state.dialog.npcId][nodeKey]; if (!data) { endDialogue(); return; } state.dialog.currentNode = data; state.dialog.choiceIdx = 0; dialogBox.classList.add('visible'); dialogText.innerHTML = data.text; renderChoices(); }
function renderChoices() { choiceContainer.innerHTML = ''; const data = state.dialog.currentNode; if (data.choices) { dialogNext.style.display = 'none'; data.choices.forEach((choice, idx) => { const btn = document.createElement('div'); btn.className = `choice-btn ${idx === state.dialog.choiceIdx ? 'active' : ''}`; btn.innerText = choice.label; choiceContainer.appendChild(btn); }); } else { dialogNext.style.display = 'block'; } }
function nextDialog() { const node = state.dialog.currentNode; if (node.choices) { const choice = node.choices[state.dialog.choiceIdx]; showDialogNode(choice.next); } else if (node.next) { showDialogNode(node.next); } else { endDialogue(); } }
function endDialogue() { state.mode = 'play'; state.dialog.active = false; dialogBox.classList.remove('visible'); }

function renderParty() {

}
function renderInventory(){ const l=document.getElementById('inv-list'); l.innerHTML=''; state.inventory.forEach((it,i)=>{ if(it.count<=0)return; const d=document.createElement('div'); d.className=`item-slot ${i===state.modal.selectedItemIdx?'selected':''}`; d.onclick=()=>{state.modal.selectedItemIdx=i;renderInventory();updateItemDetail(it);}; d.onmouseover=()=>{state.modal.selectedItemIdx=i;renderInventory();updateItemDetail(it);}; d.innerHTML=`<div style="font-size:20px">${it.icon}</div><div style="flex:1"><div style="font-size:13px;font-weight:bold">${it.name}</div><div style="font-size:11px;color:#888">x${it.count}</div></div>`; l.appendChild(d); }); }
function updateItemDetail(it){ document.getElementById('inv-icon').textContent=it.icon; document.getElementById('inv-name').textContent=it.name; document.getElementById('inv-desc').textContent=it.desc; const b=document.getElementById('inv-use-btn'); b.disabled=it.effect==='none'; b.innerText=it.effect==='none'?"사용불가":"사용하기"; }
function useItem(){ const it=state.inventory[state.modal.selectedItemIdx]; if(!it)return; if(it.effect==='hp')state.player.hp+=it.val; if(it.effect==='mp')state.player.mp+=it.val; it.count--; updateStatusBar(); renderInventory(); if(it.count<=0){state.modal.selectedItemIdx=null;updateItemDetail({icon:'📦',name:'선택 없음',desc:'...',effect:'none'});}}

/* --- [9. 입력 핸들러] --- */
renderIntroStep();
window.addEventListener('keydown', e => {
  if (e.code === 'KeyT') { toggleManual(); return; }
  if (e.code === 'Escape' && manualOverlay.classList.contains('open')) { manualOverlay.classList.remove('open'); return; }
  if (state.mode === 'intro') { if ((e.code==='Enter'||e.code==='Space') && introSequence[state.introStep].type!=='transition') { state.introStep++; renderIntroStep(); } return; }
  
  if (state.mode === 'dialog') {
    const node = state.dialog.currentNode;
    if (node.choices) {
        if (e.code === 'ArrowLeft' || e.code === 'KeyA') { state.dialog.choiceIdx = Math.max(0, state.dialog.choiceIdx - 1); renderChoices(); }
        if (e.code === 'ArrowRight' || e.code === 'KeyD') { state.dialog.choiceIdx = Math.min(node.choices.length - 1, state.dialog.choiceIdx + 1); renderChoices(); }
        if (e.code === 'Enter' || e.code === 'Space') nextDialog();
    } else {
        if (e.code === 'Enter' || e.code === 'Space') nextDialog();
    }
    return;
  }

  if (state.modal.isOpen) {
    if (e.code === 'Escape') closeModal();
    const tabs = ['trainer', 'party', 'inventory'];
    let tIdx = tabs.indexOf(state.modal.activeTab);
    if (e.code === 'KeyQ') { tIdx = (tIdx - 1 + 3) % 3; switchTab(tabs[tIdx]); }
    if (e.code === 'KeyE') { tIdx = (tIdx + 1) % 3; switchTab(tabs[tIdx]); }

    if (state.modal.activeTab === 'trainer') {
      if (e.code === 'ArrowLeft' || e.code === 'KeyA') { state.modal.selectedBtnIdx = Math.max(0, state.modal.selectedBtnIdx - 1); renderTrainer(); }
      if (e.code === 'ArrowRight' || e.code === 'KeyD') { state.modal.selectedBtnIdx = Math.min(2, state.modal.selectedBtnIdx + 1); renderTrainer(); }
      if (e.code === 'Enter' || e.code === 'Space') {
        if (state.modal.selectedBtnIdx === 0) saveGame();
        else if (state.modal.selectedBtnIdx === 1) loadGame();
        else if (state.modal.selectedBtnIdx === 2) resetGame();
      }
    } 
    else if (state.modal.activeTab === 'party') {
      if (e.code === 'ArrowUp' || e.code === 'KeyW') { state.modal.selectedPartyIdx = Math.max(0, state.modal.selectedPartyIdx - 1); renderParty(); }
      if (e.code === 'ArrowDown' || e.code === 'KeyS') { state.modal.selectedPartyIdx = Math.min(state.party.length - 1, state.modal.selectedPartyIdx + 1); renderParty(); }
    }
    else if (state.modal.activeTab === 'inventory') {
      const maxIdx = state.inventory.filter(i=>i.count>0).length - 1;
      if (state.modal.selectedItemIdx === null) state.modal.selectedItemIdx = 0;
      if (e.code === 'ArrowUp' || e.code === 'KeyW') { state.modal.selectedItemIdx = Math.max(0, state.modal.selectedItemIdx - 1); renderInventory(); updateItemDetail(state.inventory[state.modal.selectedItemIdx]); }
      if (e.code === 'ArrowDown' || e.code === 'KeyS') { state.modal.selectedItemIdx = Math.min(maxIdx, state.modal.selectedItemIdx + 1); renderInventory(); updateItemDetail(state.inventory[state.modal.selectedItemIdx]); }
      if (e.code === 'Enter' || e.code === 'Space') useItem();
    }
    return;
  }

  if (state.mode === 'play') { 
    if(state.isGameOver)return; 
    if(e.code==='Space') { checkInteraction(); return; }
    if(e.code==='KeyI') state.modal.isOpen ? closeModal() : openModal('trainer'); 
    if(e.code==='Escape'&&state.modal.isOpen) closeModal(); 
    if(state.modal.isOpen){const t=['trainer','party','inventory'];let i=t.indexOf(state.modal.activeTab);if(e.code==='KeyQ')i=(i-1+3)%3;if(e.code==='KeyE')i=(i+1)%3;switchTab(t[i]);} 
  }
  
  if(e.code==='ArrowUp' || e.code==='KeyW') state.keys.ArrowUp = true;
  if(e.code==='ArrowDown' || e.code==='KeyS') state.keys.ArrowDown = true;
  if(e.code==='ArrowLeft' || e.code==='KeyA') state.keys.ArrowLeft = true;
  if(e.code==='ArrowRight' || e.code==='KeyD') state.keys.ArrowRight = true;
});

window.addEventListener('keyup', e => {
  if(e.code==='ArrowUp' || e.code==='KeyW') state.keys.ArrowUp = false;
  if(e.code==='ArrowDown' || e.code==='KeyS') state.keys.ArrowDown = false;
  if(e.code==='ArrowLeft' || e.code==='KeyA') state.keys.ArrowLeft = false;
  if(e.code==='ArrowRight' || e.code==='KeyD') state.keys.ArrowRight = false;
});

/* --- [10. 루프] --- */
let lastTime=0;
function loop(ts) {
  const dt=Math.min((ts-lastTime)/1000,0.1); lastTime=ts;
  if(state.mode==='play'&&!state.modal.isOpen&&!state.isGameOver) updateGame(dt);
  drawGame(); requestAnimationFrame(loop);
}

function updateGame(dt) {
  const p=state.player; const s=state.sprite;
  let vx=0,vy=0;
  if(state.keys.ArrowLeft) vx-=1; if(state.keys.ArrowRight) vx+=1;
  if(state.keys.ArrowUp) vy-=1; if(state.keys.ArrowDown) vy+=1;

  if(vx||vy) {
    if(vx>0)p.dir='right'; if(vx<0)p.dir='left'; if(vy>0)p.dir='down'; if(vy<0)p.dir='up';
    const mag=(vx&&vy)?Math.SQRT1_2:1; p.x+=vx*mag*p.speed*dt; p.y+=vy*mag*p.speed*dt;
    p.hp-=1.5*dt; p.mp-=1.5*dt; updateStatusBar();
    if(p.hp<=0||p.mp<=0){state.isGameOver=true;document.getElementById('go-screen').style.display='flex';}
    s.timer+=dt; if(s.timer>s.animSpeed){s.timer=0;s.animStep=(s.animStep+1)%4;} s.frameX=[1,2,1,0][s.animStep];
    if (state.companion.active) state.companion.lastDir = p.dir;
  } else { s.frameX=1; s.animStep=0; }
  
  if (state.companion.active) {
    const c = state.companion;
    const dir = c.lastDir || p.dir;
    const offsetBaseX = (s.w || 32) * 0.8;
    const offsetBaseY = (s.h || 32) * 0.45;
    let offsetX = 0; let offsetY = 0;
    if (dir === 'left') { offsetX = offsetBaseX; offsetY = 100; }
    else if (dir === 'right') { offsetX = -offsetBaseX; offsetY = 100; }
    else if (dir === 'up') offsetY = (s.h || 32) - 54;
    else if (dir === 'down') offsetY = -90;
    const tx = p.x + offsetX; const ty = p.y + offsetY;
    c.prevX = c.x;
    const dx = tx - c.x; const dy = ty - c.y;
    const dist = Math.hypot(dx, dy);
    const followSpeed = p.speed * dt;
    if (dist <= followSpeed || dist < 2) {
      c.x = tx; c.y = ty;
    } else {
      c.x += (dx / dist) * followSpeed;
      c.y += (dy / dist) * followSpeed;
    }
    if (c.x > c.prevX + 0.1) c.face = 'right';
    else if (c.x < c.prevX - 0.1) c.face = 'left';
  }

  p.x = Math.max(0, Math.min(state.map.w, p.x)); p.y = Math.max(0, Math.min(state.map.h, p.y));
  const cw = canvas.width/DPR/ZOOM_LEVEL; const ch = canvas.height/DPR/ZOOM_LEVEL; 
  state.cam.x += (p.x-cw/2-state.cam.x)*0.1; state.cam.y += (p.y-ch/2-state.cam.y)*0.1;
}

function drawSummonEffect(c, ageMs) {
  if (!illumonLoaded) return false;
  const t = Math.min(ageMs / 900, 1);
  const ease = 1 - Math.pow(1 - t, 3);
  if (c.effectPieces.length === 0) {
    const cols = 4; const rows = 4;
    const imgW = illumonImg.width; const imgH = illumonImg.height;
    const sw = imgW / cols; const sh = imgH / rows;
    const dw = (c.w || 24) / cols; const dh = (c.h || 24) / rows;
    const bounds = c.effectBounds || { left: c.x - 200, right: c.x + 200, top: c.y - 200, bottom: c.y + 200 };
    for (let ry = 0; ry < rows; ry++) {
      for (let rx = 0; rx < cols; rx++) {
        const edge = Math.floor(Math.random() * 4);
        let startX = bounds.left; let startY = bounds.top;
        if (edge === 0) { startX = bounds.left; startY = bounds.top + Math.random() * (bounds.bottom - bounds.top); }
        if (edge === 1) { startX = bounds.right; startY = bounds.top + Math.random() * (bounds.bottom - bounds.top); }
        if (edge === 2) { startX = bounds.left + Math.random() * (bounds.right - bounds.left); startY = bounds.top; }
        if (edge === 3) { startX = bounds.left + Math.random() * (bounds.right - bounds.left); startY = bounds.bottom; }
        c.effectPieces.push({
          sx: startX,
          sy: startY,
          ox: rx * dw,
          oy: ry * dh,
          srcX: rx * sw,
          srcY: ry * sh,
          sw: sw,
          sh: sh,
          dw: dw,
          dh: dh
        });
      }
    }
  }
  const baseX = c.x - (c.w || 24) / 2;
  const baseY = c.y - (c.h || 24);
  ctx.save();
  ctx.globalAlpha = 1;
  if (c.face === 'right') {
    ctx.translate(c.x * 2, 0);
    ctx.scale(-1, 1);
  }
  for (const piece of c.effectPieces) {
    const tx = baseX + piece.ox;
    const ty = baseY + piece.oy;
    const x = piece.sx + (tx - piece.sx) * ease;
    const y = piece.sy + (ty - piece.sy) * ease;
    ctx.drawImage(illumonImg, piece.srcX, piece.srcY, piece.sw, piece.sh, x, y, piece.dw, piece.dh);
  }
  ctx.restore();
  return t >= 1;
}

function drawGame() {
  ctx.clearRect(0,0,canvas.width,canvas.height); ctx.save();
  ctx.scale(DPR*ZOOM_LEVEL, DPR*ZOOM_LEVEL); ctx.translate(-state.cam.x, -state.cam.y);
  drawCurrentMap();
  
  if (state.location === 'village') {
    state.npcs.forEach(n => {
      const r = 60; ctx.beginPath(); ctx.arc(n.x, n.y, r + n.w/2, 0, Math.PI*2); ctx.fillStyle = "rgba(100, 244, 172, 0.2)"; ctx.fill();
      const img = n.id === 'chief' ? npcChiefImg : npcImg;
      const loaded = n.id === 'chief' ? npcChiefLoaded : npcImgLoaded;
      if (loaded) ctx.drawImage(img, n.x - n.w/2, n.y - n.h, n.w, n.h);
      else { ctx.fillStyle = 'yellow'; ctx.fillRect(n.x - 32, n.y - 64, 64, 64); }
      ctx.fillStyle = "white"; ctx.font = "12px sans-serif"; ctx.textAlign = "center";
      ctx.fillText(n.id === 'chief' ? "대장" : "?", n.x, n.y - n.h - 5);
    });
  }

  const c = state.companion;
  if (c.active && illumonLoaded) {
    const age = Date.now() - c.spawnTime;
    if (age < 900) drawSummonEffect(c, age);
    if (age >= 900) {
      const bob = Math.sin(Date.now() / 220) * 2;
      const iw = c.w || 24; const ih = c.h || 24;
      if (c.face === 'right') {
        ctx.save();
        ctx.translate(c.x, 0);
        ctx.scale(-1, 1);
        ctx.drawImage(illumonImg, -iw/2, c.y - ih + bob, iw, ih);
        ctx.restore();
      } else {
        ctx.drawImage(illumonImg, c.x - iw/2, c.y - ih + bob, iw, ih);
      }
    }
  }

  const p=state.player; const s=state.sprite; const dx=Math.floor(p.x); const dy=Math.floor(p.y);
  if(s.loaded){ let r=0,f=false; if(p.dir==='up')r=1;if(p.dir==='right')r=2;if(p.dir==='left'){r=2;f=true;} ctx.save(); ctx.translate(dx,dy); if(f)ctx.scale(-1,1); ctx.drawImage(heroImg,s.frameX*s.w,r*s.h,s.w,s.h,-s.w/2,-s.h/2,s.w,s.h); ctx.restore(); }
  ctx.restore();
}
requestAnimationFrame(loop);
</script>
